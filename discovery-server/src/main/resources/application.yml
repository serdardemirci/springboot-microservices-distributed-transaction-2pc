spring:
  application:
    name: discovery-server
server:
  port: 8761
eureka:
  dashboard:
    enabled: true
  instance:
    hostname: localhost
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    eviction-interval-timer-in-ms: 30000